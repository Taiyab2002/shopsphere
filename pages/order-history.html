<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders | ShopSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://kit.fontawesome.com/70a642cd7c.js"
            crossorigin="anonymous"></script>

    <link rel="stylesheet"
          href="../assets/css/style.css">

    <link rel="stylesheet"
          href="../assets/css/navbar.css">

    <link rel="stylesheet"
          href="../assets/css/footer.css">

    <link rel="stylesheet"
          href="../assets/css/toast.css">

    <link rel="stylesheet"
          href="../assets/css/theme.css">

    <link rel="stylesheet"
          href="../assets/css/responsive.css">

</head>

<body class="bg-light">

<div id="toast-container"></div>

<div id="navbar-container"></div>


<section class="py-5">

    <div class="container">

        <div class="text-center mb-5">

            <i class="fas fa-box-open text-primary"
               style="font-size:80px;"></i>

            <h2 class="fw-bold mt-3">

                My Orders

            </h2>

            <p class="text-muted">

                View all your previous ShopSphere orders

            </p>

        </div>


        <div id="orders-container">

            <div class="card shadow-sm border-0 rounded-4">

                <div class="card-body text-center py-5">

                    <i class="fas fa-box-open text-secondary mb-3"
                       style="font-size:60px;"></i>

                    <h4 class="fw-bold">

                        No Orders Found

                    </h4>

                    <p class="text-muted">

                        You haven't placed any orders yet.

                    </p>

                    <a href="shop.html"
                       class="btn btn-primary rounded-pill px-4">

                        Continue Shopping

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>


<div id="footer-container"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../assets/js/components-live.js"></script>

<script src="../assets/js/toast.js"></script>

<script src="../assets/js/auth.js"></script>

<script src="../assets/js/theme.js"></script>

<script src="../assets/js/order-history.js"></script>


</body>

</html>
