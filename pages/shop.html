<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | ShopSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">

    <link rel="stylesheet" href="../assets/css/theme.css">

    <link rel="stylesheet" href="../assets/css/navbar.css">

    <link rel="stylesheet" href="../assets/css/footer.css">

    <link rel="stylesheet" href="../assets/css/toast.css">

    <link rel="stylesheet" href="../assets/css/responsive.css">

    <link rel="stylesheet" href="../assets/css/shop.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div id="toast-container"></div>

    <div id="navbar-container"></div>

    <!-- ================= HERO ================= -->

    <section class="shop-banner">

        <div class="banner-glow glow-1"></div>
        <div class="banner-glow glow-2"></div>

        <div class="container">

            <div class="row align-items-center">

                <div class="col-lg-6">

                    <span class="shop-badge">

                        <i class="fa-solid fa-bag-shopping me-2"></i>

                        Premium Collection

                    </span>

                    <h1 class="shop-title">

                        Discover Your

                        <span>Next Favorite</span>

                    </h1>

                    <p class="shop-subtitle">

                        Explore premium gadgets, fashion, accessories and lifestyle
                        products with the best prices.

                    </p>

                    <div class="shop-breadcrumb">

                        <a href="../index.html">Home</a>

                        <i class="fa-solid fa-angle-right"></i>

                        <span>Shop</span>

                    </div>

                </div>

                <div class="col-lg-6">

                    <div class="shop-banner-scene">

                        <div class="banner-circle circle-1"></div>
                        <div class="banner-circle circle-2"></div>

                        <img src="../assets/images/products/nike-shoes.jpg"
                            class="banner-product product-1">

                        <img src="../assets/images/products/apple-watch.jpg"
                            class="banner-product product-2">

                        <img src="../assets/images/products/headphone.jpg"
                            class="banner-product product-3">

                        <img src="../assets/images/products/iphone.jpg"
                            class="banner-product product-4">

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- ================= FILTER ================= -->

    <section class="py-5">

        <div class="container">

            <div class="row g-3 mb-4">

                <div class="col-lg-5">

                    <div class="premium-search">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input
                            id="search-input"
                            type="text"
                            class="form-control premium-input"
                            placeholder="Search Products">

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="premium-select">

                        <i class="fa-solid fa-layer-group"></i>

                        <select
                            id="category-filter"
                            class="form-select premium-input">

                            <option value="All">All Categories</option>

                            <option value="Shoes">Shoes</option>

                            <option value="Watch">Watch</option>

                            <option value="Phone">Phone</option>

                            <option value="Headphone">Headphone</option>

                            <option value="Backpack">Backpack</option>

                        </select>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="premium-select">

                        <i class="fa-solid fa-arrow-down-wide-short"></i>

                        <select
                            id="sort-filter"
                            class="form-select premium-input">

                            <option value="default">Default</option>

                            <option value="low-high">

                                Price Low → High

                            </option>

                            <option value="high-low">

                                Price High → Low

                            </option>

                            <option value="a-z">

                                A → Z

                            </option>

                            <option value="z-a">

                                Z → A

                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <!-- RESULT BAR -->

            <div class="results-bar">

                <div class="results-left">

                    <span id="results-count">

                        Showing Products

                    </span>

                </div>

                <div class="active-filters">

                </div>

            </div>

            <!-- PRODUCT GRID -->

            <div
                id="product-list"
                class="row g-4">

            </div>

            <!-- PAGINATION -->

            <nav class="mt-5">

                <ul
                    id="pagination"
                    class="pagination justify-content-center">

                </ul>

            </nav>

        </div>

    </section>

    <div id="footer-container"></div>

<div id="toast-container"></div>

<script src="../assets/js/product.js"></script>

<script src="../assets/js/components-live.js"></script>

<script src="../assets/js/toast.js"></script>

<script src="../assets/js/auth.js"></script>

<script src="../assets/js/theme.js"></script>

<script src="../assets/js/loader.js"></script>

<script src="../assets/js/scrollReveal.js"></script>

<script src="../assets/js/magnetic.js"></script>

<script src="../assets/js/ripple.js"></script>

<script src="../assets/js/tilt.js"></script>

<script src="../assets/js/shop.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
